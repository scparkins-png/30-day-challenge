<style>
:root{--bg:#f4f6f8;--card:#fff;--text:#15202b;--muted:#5b6673;--line:#e2e7ec;--accent:#0f766e;--accent2:#14b8a6;--onAccent:#fff;--soft:#e3f3f1;--ok:#15803d;--okSoft:#dcfce7;--warn:#b45309;--warnSoft:#fef3c7;--catch:#c2410c;--catchSoft:#ffedd5;--bad:#b91c1c;--badSoft:#fee2e2;--rest:#64748b;--restSoft:#e2e8f0;--shadow:0 1px 2px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.04)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1418;--card:#172026;--text:#e7edf2;--muted:#9aa7b3;--line:#27333c;--accent:#2dd4bf;--accent2:#14b8a6;--onAccent:#06201d;--soft:#113330;--ok:#4ade80;--okSoft:#123321;--warn:#fbbf24;--warnSoft:#3a2d0c;--catch:#fb923c;--catchSoft:#3a1f0e;--bad:#f87171;--badSoft:#3b1616;--rest:#94a3b8;--restSoft:#253039;--shadow:none}}
:root[data-theme=dark]{--bg:#0e1418;--card:#172026;--text:#e7edf2;--muted:#9aa7b3;--line:#27333c;--accent:#2dd4bf;--accent2:#14b8a6;--onAccent:#06201d;--soft:#113330;--ok:#4ade80;--okSoft:#123321;--warn:#fbbf24;--warnSoft:#3a2d0c;--catch:#fb923c;--catchSoft:#3a1f0e;--bad:#f87171;--badSoft:#3b1616;--rest:#94a3b8;--restSoft:#253039;--shadow:none}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
#app{max-width:520px;margin:0 auto;padding:12px 16px calc(96px + env(safe-area-inset-bottom))}
h1{font-size:1.5rem;margin:0 0 4px;line-height:1.2}
.appicon{width:28px;height:28px;border-radius:7px;vertical-align:-5px;margin-right:8px}
h2{font-size:1.1rem;margin:0 0 8px}
h3{font-size:1rem;margin:0 0 6px}
p{margin:0 0 8px}
.muted{color:var(--muted)}.small{font-size:.875rem}.tiny{font-size:.78rem}
.eyebrow{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.top{padding:8px 2px 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:0 0 12px;box-shadow:var(--shadow)}
.hero{display:flex;gap:16px;align-items:center}
.big{font-size:1.9rem;font-weight:700;line-height:1.1}
.status{border-radius:14px;padding:14px 16px;margin:0 0 12px;border:1px solid transparent}
.status h3{margin-bottom:4px}
.s-ok{background:var(--okSoft);border-color:color-mix(in srgb,var(--ok) 25%,transparent)}.s-ok h3{color:var(--ok)}
.s-warn{background:var(--warnSoft);border-color:color-mix(in srgb,var(--warn) 25%,transparent)}.s-warn h3{color:var(--warn)}
.s-bad{background:var(--badSoft)}.s-bad h3{color:var(--bad)}
.s-info{background:var(--soft)}.s-info h3{color:var(--accent)}
.btn{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;min-height:48px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--onAccent)}
.btn.warn{background:var(--warn);border-color:var(--warn);color:#fff}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent);min-height:40px;padding:6px 8px}
.btn.block{width:100%}
.btn.bmc{background:#ffdd00;border-color:#ffdd00;color:#1a1a1a}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>.btn{flex:1 1 0}
.stack>*+*{margin-top:8px}
.exlist{list-style:none;margin:8px 0 12px;padding:0}
.exlist li{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.exlist li:last-child{border-bottom:0}
.exlist .t{color:var(--muted);text-align:right;white-space:nowrap}
.pill{display:inline-block;font-size:.75rem;font-weight:600;border-radius:999px;padding:2px 8px;background:var(--soft);color:var(--accent)}
.banner{border-radius:12px;padding:10px 12px;margin:0 0 10px;font-size:.9rem;display:flex;gap:8px;align-items:flex-start;justify-content:space-between;background:var(--soft)}
.banner.test{background:var(--warnSoft);color:var(--text)}
.banner .x{background:none;border:0;color:var(--muted);font-size:1.2rem;cursor:pointer;padding:0 4px}
nav#nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:20}
nav#nav .in{display:flex;max-width:520px;width:100%}
nav#nav button{flex:1;background:none;border:0;color:var(--muted);font:inherit;font-size:.72rem;padding:8px 0 10px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;min-height:58px}
nav#nav button.on{color:var(--accent);font-weight:700}
nav#nav svg{width:24px;height:24px}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dow{font-size:.72rem;text-align:center;color:var(--muted);font-weight:600;padding-bottom:2px}
.cell{aspect-ratio:1/1.1;border-radius:10px;border:1px solid var(--line);background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.9rem;cursor:pointer;padding:0;color:var(--text);font-family:inherit;position:relative}
.cell .b{font-size:.7rem;font-weight:700;line-height:1;min-height:.8rem}
.cell.blank{border:0;background:transparent;cursor:default}
.cell.out{opacity:.35}
.cell.done{background:var(--okSoft);border-color:color-mix(in srgb,var(--ok) 35%,transparent)}.cell.done .b{color:var(--ok)}
.cell.multi{box-shadow:inset 0 0 0 2px var(--ok)}
.cell.rest{background:var(--restSoft)}.cell.rest .b{color:var(--rest)}
.cell.caught{background:var(--card);border:2px solid var(--catch)}.cell.caught .b{color:var(--text)}.cell .b .ctk{color:var(--catch);font-style:normal}.cell .b .mk{color:var(--warn)}
.legend .lgc::before{background:var(--card);border:2px solid var(--catch)}.cell.tcount .b{color:var(--accent)}.cell.tcount.multi{box-shadow:inset 0 0 0 2px var(--accent2)}.legend .nos::before{display:none}
.ct{color:var(--catch);font-weight:700}
.cell.missed{background:var(--warnSoft)}.cell.missed .b{color:var(--warn)}
.cell.planned{border-style:dashed;border-color:var(--accent2)}.cell.planned .b{color:var(--accent)}
.cell.prest{border-style:dashed;border-color:var(--rest)}.cell.prest .b{color:var(--rest)}
.cell.today{outline:2px solid var(--accent);outline-offset:1px;font-weight:700}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;font-size:.78rem;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;background:var(--c);border:1px solid var(--line)}
/* sheet */
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:40;align-items:flex-end;justify-content:center}
#sheet.open{display:flex}
#sheet .panel{background:var(--bg);width:100%;max-width:520px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:8px 16px calc(20px + env(safe-area-inset-bottom))}
#sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 12px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat .v{font-size:1.25rem;font-weight:700}
.stat .l{font-size:.78rem;color:var(--muted)}
.plan-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.plan-row .d{width:74px;font-weight:600;font-size:.9rem}
.plan-row .w{flex:1;font-size:.9rem}
.step{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:1.2rem;cursor:pointer}
.step.on{background:var(--restSoft);color:var(--rest)}
.check{padding:10px 12px;border-radius:10px;margin:10px 0;font-weight:600;font-size:.9rem}
.check.good{background:var(--okSoft);color:var(--ok)}.check.bad{background:var(--warnSoft);color:var(--warn)}
label.f{display:block;font-size:.85rem;color:var(--muted);margin:10px 0 4px}
input[type=text],input[type=date],select{width:100%;font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);min-height:46px}
.toggle{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.toggle input{width:22px;height:22px;accent-color:var(--accent)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:6px 12px;font:inherit;font-size:.85rem;white-space:nowrap;cursor:pointer}
.chip.on{background:var(--accent);color:var(--onAccent);border-color:var(--accent)}
.listbtn{display:flex;width:100%;text-align:left;justify-content:space-between;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 8px;font:inherit;color:var(--text);cursor:pointer}
.dots{letter-spacing:2px;color:var(--accent)}
.ph.pimg{background:#f4f4f1;border:1px solid var(--line);padding:0;overflow:hidden}
.ph.pimg img{width:100%;height:100%;object-fit:contain;display:block}
.ph{border-radius:14px;background:repeating-linear-gradient(135deg,var(--soft),var(--soft) 12px,var(--card) 12px,var(--card) 24px);border:1px dashed var(--line);aspect-ratio:16/9;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);text-align:center;gap:4px;margin-bottom:12px}
.ph .n{font-weight:700;color:var(--accent);font-size:1.1rem}
.chcard{display:block;width:100%;text-align:left;border:2px solid var(--line);background:var(--card);border-radius:14px;padding:14px;margin-bottom:8px;font:inherit;color:var(--text);cursor:pointer}
.chcard.on{border-color:var(--accent);background:var(--soft)}
.chcard[disabled]{opacity:.5;cursor:default}
.missed-list label{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.missed-list input{width:22px;height:22px;accent-color:var(--accent)}
/* workout */
#wk{position:fixed;inset:0;background:var(--bg);z-index:30;display:none;overflow:auto}
#wk.open{display:block}
#wk .in{max-width:520px;margin:0 auto;padding:12px 16px calc(24px + env(safe-area-inset-bottom));min-height:100%;display:flex;flex-direction:column}
.wk-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.target{font-size:2rem;font-weight:800;color:var(--accent);margin:4px 0 10px}
.timer{font-size:3.4rem;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;margin:8px 0}
.timer.lead{color:var(--warn)}
.instr{padding-left:20px;margin:0 0 12px}.instr li{margin-bottom:4px}
.spacer{flex:1}
.celebrate{text-align:center;padding:24px 0}
.celebrate .big{font-size:2.2rem}
#toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60;max-width:90vw}
#toast.on{opacity:1}
.foot{text-align:center;font-size:.8rem;color:var(--muted);margin-top:16px}
.foot a{color:var(--accent)}
.foot.support{max-width:34em;margin:10px auto 0;line-height:1.5}
hr{border:0;border-top:1px solid var(--line);margin:12px 0}
/* activity */
.actgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.actbtn{border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:12px;padding:8px 2px;font:inherit;font-size:.7rem;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;min-height:58px;line-height:1.1;text-align:center}
.actbtn span{font-size:1.35rem;line-height:1.2}
.wkt{display:flex;align-items:center;gap:10px;font-size:.9rem}
.wkb{flex:1;height:8px;background:var(--line);border-radius:4px;overflow:hidden}.wkb i{display:block;height:100%;background:var(--accent)}
.cell .ad{position:absolute;top:3px;right:4px;width:7px;height:7px;border-radius:50%;background:var(--accent2)}
/* help */
details.hp{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:0 0 8px;padding:0 14px}
details.hp summary{cursor:pointer;list-style:none;font-weight:700;padding:14px 0;display:flex;justify-content:space-between;gap:8px}
details.hp summary::-webkit-details-marker{display:none}
details.hp summary::after{content:"+";color:var(--accent);font-size:1.2rem;line-height:1}
details.hp[open] summary::after{content:"\2212"}
details.hp .in{padding:0 0 14px;font-size:.95rem}
details.hp ol,details.hp ul{padding-left:20px;margin:6px 0}
details.hp li{margin-bottom:4px}
details.hp .eg{background:var(--soft);border-radius:10px;padding:8px 10px;font-size:.88rem;margin:8px 0}
/* badges */
.medal{display:inline-block;line-height:0}.medal.locked{filter:grayscale(1);opacity:.35}
.badgeline{margin-bottom:12px}.badgeline .ml{display:flex;align-items:center;gap:12px}
.bgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.bcard{border:1px solid var(--line);border-radius:14px;padding:12px 8px;text-align:center;background:var(--card)}
.bcard h3{font-size:.95rem;margin:6px 0 2px}
.bcard .btn{min-height:38px;margin-top:8px;font-size:.85rem;padding:6px 10px}
.pbar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:6px 0}.pbar i{display:block;height:100%;background:var(--accent)}
.mrow{display:flex;justify-content:space-around;margin:4px 0 10px}
/* print */
#print{display:none}
@page{size:A4 portrait;margin:12mm}
@media print{
  html,body{background:#fff!important;color:#000!important}
  body>*:not(#print){display:none!important}
  #print{display:block;font:10pt/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#000}
  #print *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
#print h1{font-size:18pt;margin:0}
#print .cert{height:184mm;display:flex;flex-direction:column}
#print .cframe{flex:1;border:2.5pt solid #0f766e;padding:2.2mm;display:flex}
#print .cin{flex:1;border:.8pt solid #c9962b;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.2mm;text-align:center;padding:6mm}
#print .cbrand{display:flex;align-items:center;gap:2.5mm;font-weight:700;color:#0f766e;font-size:11pt}
#print .cbrand img{width:9mm;height:9mm;border-radius:2mm}
#print .ctitle{font-size:30pt;font-weight:800;color:#0f766e;letter-spacing:.02em;margin:1mm 0}
#print .cpre{font-size:12pt;color:#444}
#print .cname{font-size:26pt;font-weight:700;border-bottom:.8pt solid #999;padding:0 12mm 1mm;min-width:90mm}
#print .cbadge{font-size:24pt;font-weight:800}
#print .cfor{font-size:12.5pt}
#print .cdate{font-size:11pt;color:#333}
#print .cft{display:flex;align-items:center;justify-content:center;gap:3mm;margin-top:3mm;font-size:8.5pt;color:#444}
#print .cft img{width:6mm;height:6mm;border-radius:1.3mm}
#print .ph1{display:flex;align-items:center;gap:3mm;margin:0 0 2mm}
#print .ph1 img{width:11mm;height:11mm;border-radius:2.4mm}
#print .ph1 .url{margin-left:auto;font-weight:700;font-size:10pt;color:#0f766e}
#print .sub{font-size:9.5pt;color:#444;margin:0 0 5mm}
#print table.pl{width:100%;border-collapse:collapse}
#print table.pl th{text-align:left;font-size:8.5pt;text-transform:uppercase;letter-spacing:.04em;border-bottom:1.5pt solid #000;padding:1.5mm 2mm}
#print table.pl td{border-bottom:.5pt solid #999;padding:2mm;vertical-align:top}
#print table.pl tr{break-inside:avoid}
#print td.dt{width:24mm;font-weight:700;white-space:nowrap}
#print td.tk{width:12mm;text-align:center}
#print .box{display:inline-block;width:5mm;height:5mm;border:1pt solid #000;border-radius:1mm;vertical-align:middle;text-align:center;line-height:5mm;font-size:9pt}
#print .cd{font-weight:700}
#print .ex{color:#222}
#print .rest{font-weight:700;letter-spacing:.05em}
#print .miss{color:#777;font-style:italic}
#print .grid{display:grid;grid-template-columns:repeat(5,1fr);border-top:1pt solid #000;border-left:1pt solid #000}
#print .gc{border-right:1pt solid #000;border-bottom:1pt solid #000;padding:1.8mm 2mm 2mm;min-height:34mm;break-inside:avoid}
#print .gc .hd{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:9.5pt;margin-bottom:1.5mm;background:#000;color:#fff;margin:-1.8mm -2mm 1.8mm;padding:1mm 2mm}
#print .gc .hd .box{border-color:#fff;background:#fff}
#print .gc .hd .dd{font-weight:500;font-size:7.5pt;margin-left:1.5mm;opacity:.85;white-space:nowrap}
#print .gc .hd>span:first-child{white-space:nowrap}
#print .gc.gr{background:#eee}
#print .gc .rs{font-size:16pt;font-weight:800;letter-spacing:.12em;text-align:center;margin-top:7mm;color:#333}
#print .gc div.l{font-size:8.3pt;line-height:1.35}
#print .gc div.l b{display:inline-block;min-width:8mm;text-align:right;margin-right:1.2mm}
#print .keys{display:grid;grid-template-columns:repeat(6,1fr);gap:3mm;margin-top:5mm}
#print .key{border:.7pt dashed #888;border-radius:2mm;height:16mm;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:1mm;font-size:8pt;font-weight:700;text-align:center;overflow:hidden}
#print .key img{width:100%;flex:1;min-height:0;object-fit:contain}
#print .ft{margin-top:4mm;font-size:8pt;color:#555;display:flex;justify-content:space-between}
</style>
</head>

<div id="app"></div>
<nav id="nav"><div class="in"></div></nav>
<div id="wk"><div class="in"></div></div>
<div id="sheet"><div class="panel"><div class="grab"></div><div class="body"></div></div></div>
<div id="toast"></div>
<div id="print"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>
<script>
/* 30 Day Challenge (Do30DayChallenge.com)

'use strict';
/* ===================== DATA ===================== */
const APP_VERSION = '1.9.3';
const AREAS = {abs:'Abs', obliques:'Obliques', core:'Core', 'hip-flexors':'Hip flexors', shoulders:'Shoulders', chest:'Chest', arms:'Arms', legs:'Legs', cardio:'Cardio'};
// count: single | total (each side counts 1) | pair (both sides = 1) | eachSide (timed, per side)
const EXERCISES = [
 {id:'crunch',name:'Crunch',areas:['abs'],difficulty:1,measure:'reps',count:'single',image:null,alternatives:['heel-touch','dead-bug'],
  instructions:['Lie on your back, knees bent, feet flat, fingertips lightly behind your head.','Curl your shoulders off the floor using your stomach, not your neck.','Lower slowly with control.']},
 {id:'sit-up',name:'Sit-up',areas:['abs','hip-flexors'],difficulty:2,measure:'reps',count:'single',image:null,alternatives:['crunch'],
  instructions:['Lie on your back, knees bent, feet flat or anchored.','Curl all the way up until your chest is close to your knees.','Lower back down slowly, one section of your spine at a time.']},
 {id:'heel-touch',name:'Heel Touch',areas:['obliques','abs'],difficulty:1,measure:'reps',count:'total',image:null,alternatives:['crunch'],

  if(!ch.definition||!Array.isArray(ch.definition.exercises)||(ch.definition.progression!=='daily'&&!Array.isArray(ch.definition.stages))) e.push(label+': missing challenge definition');
  if(!Array.isArray(ch.completions)||!Array.isArray(ch.rests)) e.push(label+': missing entries');

  }

  if(c.status==='complete'){
    const s=summarise(a);

    if(a.month===monthOf(t) && lastEntry(a)) h+=`<p style="text-align:center;margin-top:8px"><button class="btn ghost" data-act="undo">Undo last entry</button></p>`;
    return h+upcomingCard(t);
  }

    const le=lastEntry(a);
    h+=`<div class="card"><h2>Rest day</h2><p class="muted">Today used Challenge Day ${e.r.day} as a rest.</p>${le&&le.type==='rest'&&le.date===t?'<button class="btn block" data-act="undo">Undo rest</button>':''}</div>`;
  } else if(!e.w.length && c.planned.includes(t) && c.L>0){
    h+=`<div class="card"><h2>Rest day planned</h2><p class="muted">Today is one of your rest days. Resting uses Challenge Day ${restDue(a,t)} and 1 of your ${c.L} rest ${pl(c.L,'day')}.</p>
     <div class="stack"><button class="btn primary block" data-act="restToday">Rest today</button><button class="btn block" data-act="workInstead">Work out instead (keep the rest day for later)</button></div></div>`;

  h+=upcomingCard(t);
  return h;
}
function statsHtml(s){
  const b=s.busiest?`${s.busiest.count} on ${fmtShort(s.busiest.date)}`:'\u2014';
  return `<div class="stat"><div class="v">${s.score}/30</div><div class="l">Challenge Days</div></div><div class="stat"><div class="v">${s.calendarDaysUsed}</div><div class="l">Calendar days taken</div></div><div class="stat"><div class="v">${s.restDays}</div><div class="l">Rest days</div></div><div class="stat"><div class="v">${s.catchUpDays}</div><div class="l">Catch-up days</div></div><div class="stat" style="grid-column:1/-1"><div class="v">${b}</div><div class="l">Busiest day (workouts)</div></div>`;
}
function cellInfo(ch,d,t,sch,miss){
  if(d<ch.startDate) return {cls:'out',b:''};
  const e=dateEntries(ch,d), o=ownStatus(ch,d), n=e.w.length;
  if(e.r) return {cls:'rest',b:'Rest'};
  const onlyOwn = n===1 && o && o.w && o.w.date===d;
  const cnt = n && !onlyOwn ? '\u00d7'+n : '';
  const multi = n>1 ? ' multi' : '';
  if(o&&o.s==='caught') return {cls:'caught'+multi,b:(cnt?cnt+' ':'')+'<i class="ctk">\u2713</i>'};
  if(d<t){
    if(o&&o.s==='open') return {cls:'missed'+multi,b:(cnt?cnt+' ':'')+'<i class="mk">!</i>'};
    if(n) return {cls:'done'+multi,b:cnt||'\u2713'};
    if(o&&o.s==='done') return {cls:'done',b:'\u2713'};
    return {cls:'gap',b:''};
  }
  if(d===t && n) return (o&&o.s==='done') ? {cls:'done'+multi,b:cnt||'\u2713'} : {cls:'tcount'+multi,b:cnt};
  if(sch&&sch.map[d]){ const r=sch.map[d]; if(r.rest) return {cls:'prest',b:'Rest'}; if(r.days.length) return {cls:'planned',b:r.days.length>1?'\u00d7'+r.days.length:'\u2022'}; }
  if(o&&o.s==='done') return {cls:'done',b:'\u2713'};
  return {cls:'future',b:''};
}
function monthGrid(ch,t,interactive){
  const m=ch.month, first=m+'-01', end=monthEnd(m), lead=(parse(first).getDay()+6)%7;
  const sch = interactive && t<=end ? schedule(ch,t) : null, miss=new Set(calc(ch,t).missed);
  let h=`<div class="cal">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(x=>`<div class="dow">${x}</div>`).join('')}`;
  for(let i=0;i<lead;i++) h+='<div class="cell blank"></div>';
  for(let d=first; d<=end; d=addDays(d,1)){
    const ci=cellInfo(ch,d,t,sch,miss);
    h+=`<button class="cell ${ci.cls} ${d===t?'today':''}" ${interactive?`data-act="day" data-arg="${d}"`:`data-act="hday" data-arg="${d}"`} aria-label="${fmtLong(d)}">${actsOn(d).length?'<i class="ad" title="Other activity"></i>':''}<span>${Number(d.slice(8))}</span><span class="b">${ci.b}</span></button>`;
  }
  return h+'</div>';
}

const wkEl=document.getElementById('wk'); let wk=null, tm=null, audioCtx=null;
function openWorkout(day,catchFor){
  const a=state.active, c=calc(a,today()); if(c.R<=0) return;
  const n=(day!=null&&outstandingDays(a).includes(day))?day:c.next;
  wk={day:n,i:0,items:resolveDay(a.definition,n,a.swaps),finished:false,catchFor:catchFor||undefined,caught:null};
  resetTimer(); wkEl.classList.add('open'); renderWk();
}
function closeWorkout(){ stopTimer(); wk=null; wkEl.classList.remove('open'); render(); }
function resetTimer(){
  stopTimer(); if(!wk||wk.finished) { tm=null; return; }
  const it=wk.items[wk.i]; if(it.ex.measure!=='seconds'){ tm=null; return; }
  tm={total:it.target,left:it.target,lead:0,running:false,side:1,sides:it.ex.count==='eachSide'?2:1,h:null,finished:false};
}
function stopTimer(){ if(tm&&tm.h){ clearInterval(tm.h); tm.h=null; } if(tm) tm.running=false; }
function beep(freq,dur){
  if(!state.settings.sound) return;
  try{ audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)(); const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.frequency.value=freq; o.connect(g); g.connect(audioCtx.destination); g.gain.setValueAtTime(.2,audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+dur);
    o.start(); o.stop(audioCtx.currentTime+dur); }catch(e){}
}
function startTimer(){
  if(!tm||tm.running) return;
  if(tm.finished){ tm.left=tm.total; tm.finished=false; }
  tm.running=true; if(state.settings.leadIn && tm.left===tm.total) { tm.lead=3; beep(660,.12); }
  tm.h=setInterval(()=>{
    if(tm.lead>0){ tm.lead--; if(tm.lead>0) beep(660,.12); else beep(990,.2); }
    else { tm.left--; if(tm.left<=3&&tm.left>0) beep(660,.08);
      if(tm.left<=0){ stopTimer(); beep(880,.5); if(state.settings.vibrate&&navigator.vibrate) navigator.vibrate([200,100,200]);
        if(tm.side<tm.sides){ tm.side++; tm.left=tm.total; toast('Now the other side'); } else tm.finished=true; } }
    updTimer();
  },1000);
  updTimer();
}
function updTimer(){
  const el=document.getElementById('tmv'); if(!el||!tm) return;
  el.textContent = tm.lead>0 ? tm.lead : (tm.finished ? 'Done' : `${Math.floor(tm.left/60)}:${pad(tm.left%60)}`);
  el.classList.toggle('lead',tm.lead>0);
  const sl=document.getElementById('tmside'); if(sl) sl.textContent = tm.sides>1 ? (tm.side===1?'First side':'Second side') : '';
  const b=document.getElementById('tmbtn'); if(b) b.textContent = tm.running?'Pause':(tm.finished?'Restart':(tm.left<tm.total||tm.side>1?'Resume':'Start timer'));
}
function renderWk(){
  const box=wkEl.querySelector('.in'); const a=state.active;
  if(!wk) return;
  if(wk.finished){
    const c=calc(a,today()); let h=`<div class="wk-top"><span></span><button class="btn ghost" data-act="wkClose">Close</button></div><div class="celebrate"><div class="big">Day ${wk.day} \u2713</div><p>Challenge Day ${wk.day} complete.</p>${wk.caught?`<p class="ct">Caught up for ${fmtLong(wk.caught)} \u2713</p>`:''}<p class="muted">${c.done}/${c.len} done this month.</p></div><div class="spacer"></div><div class="stack">`;
    if(c.R>0){ const behind=c.S<0;
      h+=`${behind?`<p class="small" style="text-align:center">Still ${-c.S} extra ${pl(-c.S,'workout')} to catch up this month.</p>`:''}<button class="btn ${behind?'primary':''} block" data-act="wkContinue">Continue with Day ${c.next}${behind?' (catch-up)':''}</button>`;
    } else h+=`<p style="text-align:center"><b>That\u2019s all 30 \u2014 challenge complete!</b></p>`;
    h+=`<button class="btn ${c.R>0&&c.S<0?'':'primary'} block" data-act="wkClose">Done for today</button></div>`;
    box.innerHTML=h; return;
  }
  const it=wk.items[wk.i], n=wk.items.length, last=wk.i===n-1;
  let h=`<div class="wk-top"><span class="small"><b>Challenge Day ${wk.day}</b> \u00b7 Exercise ${wk.i+1} of ${n}</span><button class="btn ghost" data-act="wkQuit">Exit</button></div><div class="bar"><i style="width:${(wk.i/n)*100}%"></i></div>`;
  h+=placeholder(it.ex)+`${it.role==='warmup'?'<div class="eyebrow">Warm-up</div>':it.role==='extra'?'<div class="eyebrow">Extra</div>':''}<h1>${esc(it.ex.name)}</h1><div class="target">${targetLabel(it.ex,it.target)}</div>`;

const b64u={ enc:u8=>{ let b=''; u8.forEach(x=>b+=String.fromCharCode(x)); return btoa(b).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); },

function packCh(ch){
  if(!ch) return null;
  const known=CHALLENGES.find(c=>c.id===ch.definition.id&&c.version===ch.definition.version);
  const dom=d=>Number(d.slice(8)), key=x=>(x.seq||0)*1e14+Date.parse(x.at||x.date+'T12:00:00');
  const ents=[...ch.completions.map(x=>({...x,t:0})),...ch.rests.map(x=>({...x,t:1}))].sort((a,b)=>key(a)-key(b)).map(x=>x.for&&!x.t?[x.day,dom(x.date),x.t,dom(x.for)]:[x.day,dom(x.date),x.t]);
  const pd={}; Object.entries(ch.planDays||{}).forEach(([d,l])=>{ if(l&&l.length) pd[dom(d)]=l; });
  const pl2={}; Object.entries(ch.plan||{}).forEach(([d,k])=>pl2[dom(d)]=k);
  const o={m:ch.month,s:dom(ch.startDate),d:known?ch.definition.id+'@'+ch.definition.version:ch.definition,e:ents};
  if(known && ch.definition.level && ch.definition.level!=='easy') o.lv=ch.definition.level;
  if(ch.plannedRestDates.length) o.r=ch.plannedRestDates.map(dom);

}
function unpackCh(o,archived){

  const dt=n=>`${o.m}-${pad(n)}`, ch={id:`${o.m}-${def.id}`,month:o.m,startDate:dt(o.s),definition:def,completions:[],rests:[],
    plannedRestDates:(o.r||[]).map(dt),skipRestDates:(o.k||[]).map(dt),plan:{},planDays:{},swaps:o.w||{}};
  (o.e||[]).forEach(([day,d,t,f],i)=>{ const x={day,date:dt(d),seq:i+1}; if(f&&!t) x.for=dt(f); (t?ch.rests:ch.completions).push(x); });

async function makeBackupLink(){
  const st=state.settings;

  if(acts().length) o.x=acts().map(a=>{ const r=[a.date,a.type,a.mins||0,a.km?Math.round(a.km*100):0]; if(a.note) r.push(a.note); return r; });
  const raw=new TextEncoder().encode(JSON.stringify(o));
  let body; try{ body='z'+b64u.enc(await zip(raw,'c')); }catch(e){ body='j'+b64u.enc(raw); }

}
async function readBackupLink(text){

    activities:(o.x||[]).map(([date,type,mins,km100,note],i)=>{ const a={id:'r'+i+'-'+date,date,type,at:date+'T12:00:00.000Z'}; if(mins) a.mins=mins; if(km100) a.km=km100/100; if(note) a.note=note; return a; })};
}

    if(pi&&navigator.storage&&navigator.storage.persisted) navigator.storage.persisted().then(p=>{ pi.textContent=p?'This browser has agreed to keep your data.':'Storage isn\u2019t marked permanent in this browser, so keep backups.'; }).catch(()=>{}); }
  checkBadges(); setTimeout(showBadgeQueue,250);
}

if('serviceWorker' in navigator && location.protocol!=='file:'){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js').then(reg=>{
      const offer=()=>{ const b=document.createElement('div'); b.className='banner'; b.id='updBanner';
        b.style.cssText='position:fixed;left:12px;right:12px;bottom:calc(72px + env(safe-area-inset-bottom));z-index:50;max-width:496px;margin:0 auto;box-shadow:0 4px 16px rgba(0,0,0,.15)';
        b.innerHTML='<span>A new version of the app is ready.</span><button class="btn ghost" id="updBtn">Refresh</button>';
        if(!document.getElementById('updBanner')){ document.body.appendChild(b);
          document.getElementById('updBtn').onclick=()=>{ reg.waiting&&reg.waiting.postMessage('skipWaiting'); }; } };
      if(reg.waiting && navigator.serviceWorker.controller) offer();
      reg.addEventListener('updatefound',()=>{ const w=reg.installing; w&&w.addEventListener('statechange',()=>{ if(w.state==='installed'&&navigator.serviceWorker.controller) offer(); }); });
      setInterval(()=>reg.update().catch(()=>{}),60*60*1000);
    }).catch(()=>{});
    let reloaded=false; const hadController=!!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener('controllerchange',()=>{ if(hadController && !reloaded){ reloaded=true; location.reload(); } });
  });
}
